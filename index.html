<style>
  :root{
    --ink:#000;
    --paper:#fff;
    --accent:#c8ff00;
    --tile:#efefec;
    --hatch:#dbdbd5;
    --slot:#8f8f88;
    --dot:18px;
    --row:clamp(38px,6.2vw,64px);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--paper)}

  body{
    min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:Newsreader,Times,'Times New Roman',serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    padding:clamp(14px,2.6vw,30px) clamp(14px,2.6vw,30px) clamp(60px,10vw,120px);
    position:relative;
    overflow-x:hidden;
  }
  body.cursor-none{cursor:none}

  a{color:inherit;text-decoration:none}
  a:hover{color:inherit}

  /* ── masthead ─────────────────────────────────────── */
  .mast,
  #ov.is-mast{
    font-family:'PP Mondwest',Newsreader,Times,serif;
    font-size:clamp(34px,5.6vw,58px);
    line-height:1.2;
    letter-spacing:0;
  }
  .mast{
    display:inline-block;
    cursor:inherit;
  }

  /* ── index ────────────────────────────────────────── */
  .index{
    margin-top:clamp(34px,5.6vw,64px);
    display:flex;
    flex-direction:column;
  }

  .row{
    cursor:inherit;
    display:flex;
    align-items:center;
    gap:0.22em;
    font-size:var(--row);
    line-height:1.22;
    letter-spacing:-0.01em;
    width:max-content;
    max-width:100%;
    color:var(--ink);
    transition:color .2s ease;
  }
  .row:hover{color:var(--accent)}

  .row .t{white-space:nowrap}

  /* rows with no thumbnail — article titles. Smaller, and they wrap. */
  .row.txt{font-size:clamp(22px,3.2vw,34px);align-items:baseline;line-height:1.3}
  .row.txt .t{white-space:normal}
  .row.txt .y{font-size:0.44em;top:0}

  .thumb{
    position:relative;
    flex:0 0 auto;
    height:0.86em;
    overflow:hidden;
    background:var(--tile);
    transform:none;
    transition:transform .3s cubic-bezier(.2,.7,.2,1);
  }
  .row:hover .thumb{transform:scale(1.1)}

  .thumb .hatch{
    position:absolute;inset:0;
    background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 6px);
  }
  .thumb .slot{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    font-size:7px;letter-spacing:0.02em;
    color:var(--slot);text-align:center;line-height:1.1;padding:1px;
  }
  .thumb img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;display:block;
  }

  .row .y,
  #ov .y{
    padding-left:0.3em;
    font-family:Helvetica,'Helvetica Neue',Arial,sans-serif;
    font-size:0.34em;
    letter-spacing:0.02em;
    white-space:nowrap;
    position:relative;
    top:-0.02em;
  }

  /* ── cursor dot + punched-out inversion ───────────── */
  #dot{
    position:fixed;top:0;left:0;
    width:var(--dot);height:var(--dot);
    border-radius:50%;
    background:var(--ink);
    pointer-events:none;
    z-index:60;
    opacity:0;
    transition:opacity .18s ease;
  }
  #ov{
    position:fixed;top:0;left:0;
    pointer-events:none;
    z-index:61;
    opacity:0;
    color:#fff;
    display:flex;align-items:center;gap:0.22em;
    font-size:var(--row);
    line-height:1.22;
    letter-spacing:-0.01em;
    white-space:nowrap;
  }
  #ov .thumb{background:#000;transform:scale(1.1)}
  #ov .thumb .hatch{
    background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.5) 0 1px,transparent 1px 6px);
  }
  #ov .thumb .slot{color:rgba(255,255,255,.75)}

  /* ── section labels ───────────────────────────────── */
  .sec{
    font-family:Helvetica,'Helvetica Neue',Arial,sans-serif;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#a3a39b;
    margin:clamp(30px,4vw,52px) 0 clamp(10px,1.2vw,16px);
  }
  .sec:first-child{margin-top:0}

  /* ── colophon ─────────────────────────────────────── */
  .colophon{
    margin-top:clamp(46px,7vw,86px);
    font-size:clamp(15px,1.5vw,18px);
    line-height:1.7;
    color:#6b6b66;
  }
  .colophon a{border-bottom:1px solid #cfcfc8;cursor:inherit}
  .colophon a:hover{color:var(--ink);border-bottom-color:var(--ink)}
  .colophon .sep{padding:0 .5em;color:#c3c3bc}

  .socials{display:flex;gap:8px;margin-top:18px}
  .socials a{
    width:30px;height:30px;border-radius:50%;
    background:var(--ink);color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-family:Helvetica,'Helvetica Neue',Arial,sans-serif;
    font-size:10px;letter-spacing:0.02em;
    cursor:inherit;border-bottom:0;
    transition:background .2s ease;
  }
  .socials a:hover{background:#3d3d38;color:var(--paper)}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

  <a class="mast" id="mast" href="#index">hazarustun-spec.github.io/portfolio</a>

  <div class="index" id="index"></div>

  <div class="colophon">
    Hazar Üstün — Istanbul.<span class="sep">·</span><a href="https://hazarustun.com" target="_blank" rel="noopener">hazarustun.com</a><span class="sep">·</span><a href="mailto:hazarustun@gmail.com">hazarustun@gmail.com</a><span class="sep">·</span><a href="https://github.com/hazarustun-spec" target="_blank" rel="noopener">GitHub</a>
    <div class="socials">
      <a href="https://www.instagram.com/hazarustun/" target="_blank" rel="noopener" title="@hazarustun" aria-label="Instagram: hazarustun">Ig</a>
      <a href="https://www.instagram.com/hazarvstvn/" target="_blank" rel="noopener" title="@hazarvstvn" aria-label="Instagram: hazarvstvn">Ig</a>
    </div>
  </div>

  <div id="dot"></div>
  <div id="ov"></div>

<script>
/* ────────────────────────────────────────────────────────────
   The index. Each section is a label plus its rows.
   `img` — drop a file in img/ and set it, the hatch placeholder
   disappears. `url` — a row with a url becomes a link; without
   one it renders as plain text. `w` is the thumbnail's width
   relative to its height (0.86em).
   ──────────────────────────────────────────────────────────── */
const SECTIONS = [
  { label: "Products", items: [
    { title:"Merge Zoo",          year:"2026", slot:"board",      w:0.90, img:"", url:"" },
    { title:"Shimal",             year:"2025", slot:"reading",    w:0.88, img:"", url:"" },
    { title:"marker.",            year:"2026", slot:"brief",      w:0.88, img:"", url:"https://github.com/hazarustun-spec/ios_app-marker." },
    { title:"ChallengeBu!",       year:"2026", slot:"ladder",     w:1.15, img:"", url:"https://github.com/hazarustun-spec/ios_app-challengebu" },
    { title:"pin2insta",          year:"2026", slot:"queue",      w:1.55, img:"", url:"https://github.com/hazarustun-spec/web_app-pin2insta" },
    { title:"drappin",            year:"2026", slot:"wishlist",   w:0.92, img:"", url:"" },
    { title:"Antrenman",          year:"2026", slot:"the week",   w:1.50, img:"", url:"https://antrenman-two.vercel.app" },
    { title:"Çekim Yasası",       year:"2026", slot:"the draw",   w:1.30, img:"", url:"" },
    { title:"ShoText",            year:"2025", slot:"a message",  w:0.88, img:"", url:"" },
    { title:"getmeto",            year:"2026", slot:"the way",    w:0.90, img:"", url:"" },
    { title:"Kütüphane",          year:"2026", slot:"the shelf",  w:0.92, img:"", url:"" },
    { title:"Pano Yöneticisi",    year:"2026", slot:"clipboard",  w:1.35, img:"", url:"" },
    { title:"notpaddy",           year:"2026", slot:"the editor", w:1.40, img:"", url:"" },
    { title:"bogazicimag desk",   year:"2026", slot:"the desk",   w:1.50, img:"", url:"" },
    { title:"Continental Archive",year:"2026", slot:"the queue",  w:1.55, img:"", url:"" }
  ]},
  { label: "Sites", items: [
    { title:"shimal.app",         year:"2025", slot:"the studio", w:1.55, img:"", url:"https://shimal.app" },
    { title:"calvinopaints.com",  year:"2025", slot:"the shop",   w:1.50, img:"", url:"https://www.calvinopaints.com/" },
    { title:"mochu.store",        year:"2025", slot:"the shop",   w:1.50, img:"", url:"https://www.mochu.store/" },
    { title:"hazarustun.com",     year:"2019", slot:"the writing",w:1.45, img:"", url:"https://hazarustun.com" },
    { title:"hazarca.tr.gg",      year:"2009", slot:"age nine",   w:1.35, img:"", url:"https://hazarca.tr.gg" }
  ]},
  { label: "Writing", items: [
    { title:"@bogazicimag",       year:"2021", slot:"the magazine", w:1.45, img:"", url:"https://www.instagram.com/bogazicimag/" },
    { title:"Burger King's Burger Glitch takes two Gold Lions", year:"2022", slot:"", w:0, img:"", url:"https://bigumigu.com/haber/burger-king-burger-glitch-2-kategoride-altin-aslan-kazandi-cannes-lions-2022/" },
    { title:"Starbucks turns a museum into personal exhibits",  year:"2022", slot:"", w:0, img:"", url:"https://bigumigu.com/haber/starbucks-la-kalplere-dokunan-bir-kahve-molasi/" },
    { title:"Could the car you just passed have been hacked?",  year:"2022", slot:"", w:0, img:"", url:"https://bigumigu.com/haber/trafikte-gordugunuz-otomobil-hacklenmis-olabilir-mi/" },
    { title:"Instagram extends its sensitive content controls", year:"2022", slot:"", w:0, img:"", url:"https://bigumigu.com/haber/instagramdan-hassas-icerik-kontrol-sistemine-guncelleme/" }
  ]}
];

const DOT = 18;          // resting cursor size, px
const GROW = 2.6;        // multiplier when the cursor is over type

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ── build the index ─────────────────────────────────────── */
const index = document.getElementById("index");

function rowInner(p){
  let thumb = "";
  if (p.w > 0) {
    const fill = p.img
      ? `<img src="${esc(p.img)}" alt="${esc(p.title)}" loading="lazy">`
      : `<span class="hatch"></span><span class="slot">${esc(p.slot)}</span>`;
    thumb = `<span class="thumb" style="width:${(p.w * 0.86).toFixed(2)}em">${fill}</span>`;
  }
  return `<span class="t">${esc(p.title)}</span>`
       + thumb
       + `<span class="y">${esc(p.year)}</span>`;
}

SECTIONS.forEach(section => {
  const label = document.createElement("div");
  label.className = "sec";
  label.textContent = section.label;
  index.appendChild(label);

  section.items.forEach(p => {
    const el = document.createElement(p.url ? "a" : "div");
    el.className = p.w > 0 ? "row" : "row txt";
    if (p.url) { el.href = p.url; el.target = "_blank"; el.rel = "noopener"; }
    el.innerHTML = rowInner(p);
    el.__project = p;
    index.appendChild(el);
  });
});

/* ── cursor dot and the white copy punched out inside it ── */
const dot = document.getElementById("dot");
const ov  = document.getElementById("ov");

let mouse = { x: -9999, y: -9999 };
let hoverEl = null;
let overText = false;
let desktop = false;

const mq = window.matchMedia("(min-width: 760px) and (hover: hover)");
function syncMode(){
  desktop = mq.matches;
  document.body.classList.toggle("cursor-none", desktop);
  if (!desktop) { dot.style.opacity = "0"; ov.style.opacity = "0"; }
}
mq.addEventListener ? mq.addEventListener("change", syncMode) : mq.addListener(syncMode);
syncMode();

function paint(){
  const size = DOT * (overText ? GROW : 1);
  const h = size / 2;
  const on = desktop && mouse.x > -1000;

  dot.style.opacity = on ? "1" : "0";
  dot.style.width = dot.style.height = size + "px";
  if (on) dot.style.transform = `translate3d(${mouse.x - h}px,${mouse.y - h}px,0)`;

  if (on && hoverEl) {
    const r = hoverEl.getBoundingClientRect();
    ov.style.opacity = "1";
    ov.style.transform = `translate3d(${r.left}px,${r.top}px,0)`;
    ov.style.height = r.height + "px";
    ov.style.clipPath = `circle(${h}px at ${mouse.x - r.left}px ${mouse.y - r.top}px)`;
  } else {
    ov.style.opacity = "0";
  }
}

function enterRow(el){
  hoverEl = el;
  overText = true;
  const p = el.__project;
  ov.classList.toggle("is-mast", !p);
  ov.innerHTML = p ? rowInner(p) : `<span class="t">${esc(el.textContent.trim())}</span>`;
  paint();
}
function leaveRow(){
  hoverEl = null;
  overText = false;
  paint();
}

[...document.querySelectorAll(".row")].forEach(el => {
  el.addEventListener("mouseenter", () => enterRow(el));
  el.addEventListener("mouseleave", leaveRow);
});

const mast = document.getElementById("mast");
mast.addEventListener("mouseenter", () => enterRow(mast));
mast.addEventListener("mouseleave", leaveRow);

document.addEventListener("mousemove", e => {
  mouse = { x: e.clientX, y: e.clientY };
  paint();
});
document.addEventListener("mouseleave", () => {
  mouse = { x: -9999, y: -9999 };
  overText = false;
  paint();
});
window.addEventListener("scroll", paint, { passive:true });
window.addEventListener("resize", paint);
</script>
