<style>
  :root{
    --ink:#000;
    --paper:#fff;
    --accent:#c8ff00;
    --tile:#efefec;
    --hatch:#dbdbd5;
    --slot:#8f8f88;
    --dot:18px;
    --ios:#ff2e9f;
    --web:#00cfff;
    --app:#ffe600;
    --game:#00f57a;
    --macos:#b026ff;
    --creator:#ff7a1f;
    --navy:#1f3ce8;
    --row:clamp(30px,4.8vw,50px);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--paper)}

  body{
    min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:Newsreader,Times,'Times New Roman',serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    padding:clamp(14px,2.6vw,30px) clamp(14px,2.6vw,30px) clamp(60px,10vw,120px);
    position:relative;
    overflow-x:hidden;
  }
  body.cursor-none{cursor:none}

  a{color:inherit;text-decoration:none}
  a:hover{color:inherit}

  /* ── masthead ─────────────────────────────────────── */
  .mast,
  #ov.is-mast{
    font-family:'PP Mondwest',Newsreader,Times,serif;
    font-size:clamp(34px,5.6vw,58px);
    line-height:1.2;
    letter-spacing:0;
  }
  .mast{
    display:inline-block;
    cursor:inherit;
  }

  /* ── index ────────────────────────────────────────── */
  .index{
    margin-top:clamp(34px,5.6vw,64px);
    display:flex;
    flex-direction:column;
  }

  .row{
    cursor:inherit;
    padding:0.16em 0;
    display:flex;
    align-items:center;
    gap:0.22em;
    font-size:var(--row);
    line-height:1.22;
    letter-spacing:-0.01em;
    width:max-content;
    max-width:100%;
    color:var(--ink);
    transition:color .2s ease;
  }
  .row:hover{color:var(--accent)}

  .row .t{white-space:normal}

  /* category dots, left of the title */
  .tags{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:0.07em;
    margin-right:0.16em;
  }
  .tags i{
    width:0.17em;height:0.17em;
    border-radius:50%;
    display:block;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.09);
  }
  .t-ios{background:var(--ios)}
  .t-web{background:var(--web)}
  .t-app{background:var(--app)}
  .t-game{background:var(--game)}
  .t-macos{background:var(--macos)}
  .t-creator{background:var(--creator)}

  /* TestFlight */
  .tf{
    font-family:Helvetica,'Helvetica Neue',Arial,sans-serif;
    font-size:0.32em;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--navy);
    padding-left:0.7em;
    white-space:nowrap;
    cursor:inherit;
    transition:opacity .2s ease;
  }
  .tf:hover{color:var(--navy);opacity:.6}

  /* hover tooltip */
  #tip{
    position:fixed;top:0;left:0;
    z-index:70;
    width:250px;
    background:var(--paper);
    border:1px solid var(--ink);
    padding:10px;
    pointer-events:none;
    opacity:0;
    transform:translate3d(0,0,0);
    transition:opacity .18s ease;
    will-change:transform;
  }
  #tip.on{opacity:1}
  #tip .pic{
    display:block;width:100%;
    background:var(--tile);
    background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 6px);
    aspect-ratio:16/10;
    margin-bottom:9px;
  }
  #tip img.pic{
    background-image:none;
    aspect-ratio:auto;
    width:auto;max-width:100%;max-height:240px;
    margin:0 auto 9px;
  }
  #tip .sub{
    margin:0 0 4px;
    font-family:Helvetica,'Helvetica Neue',Arial,sans-serif;
    font-size:12px;font-weight:700;line-height:1.35;color:var(--ink);
  }
  #tip p{
    margin:0;
    font-family:Helvetica,'Helvetica Neue',Arial,sans-serif;
    font-size:12px;line-height:1.45;color:var(--ink);
  }
  #tip .meta{
    margin-top:6px;
    font-family:Helvetica,'Helvetica Neue',Arial,sans-serif;
    font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:#a3a39b;
  }

  /* screenshot gallery, on hovering a thumbnail */
  #shots{
    position:fixed;top:0;left:0;
    z-index:69;
    max-width:min(70vw,720px);
    background:var(--paper);
    border:1px solid var(--ink);
    padding:10px;
    pointer-events:none;
    opacity:0;
    transition:opacity .18s ease;
    will-change:transform;
  }
  #shots.on{opacity:1}
  #shots .strip{display:flex;gap:8px;align-items:flex-start}
  #shots img{height:200px;width:auto;display:block}
  #shots .cap{
    margin-top:8px;
    font-family:Helvetica,'Helvetica Neue',Arial,sans-serif;
    font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:#a3a39b;
  }

  /* the key, pinned to the right edge */
  .key{
    position:fixed;
    right:clamp(14px,2.6vw,30px);
    top:50%;
    transform:translateY(-50%);
    z-index:40;
    font-family:Helvetica,'Helvetica Neue',Arial,sans-serif;
    pointer-events:none;
  }
  .key h2{
    margin:0 0 12px;
    font:inherit;
    font-size:11px;
    font-weight:400;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#a3a39b;
  }
  .key ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
  .key li{display:flex;align-items:center;gap:9px;font-size:12px;color:#6b6b66}
  .key i{
    width:12px;height:12px;border-radius:50%;display:block;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.09);
  }

  @media (max-width:1080px){
    .key{
      position:static;transform:none;
      margin:0 0 clamp(24px,4vw,40px);
    }
    .key ul{flex-direction:row;flex-wrap:wrap;gap:8px 20px}
  }

  .thumb{
    position:relative;
    flex:0 0 auto;
    height:0.86em;
    align-self:center;
    overflow:hidden;
    background:var(--tile);
    transform:none;
    transition:transform .3s cubic-bezier(.2,.7,.2,1);
  }
  .row:hover .thumb{transform:scale(1.1)}

  .thumb .hatch{
    position:absolute;inset:0;
    background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 6px);
  }
  .thumb .slot{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    font-size:7px;letter-spacing:0.02em;
    color:var(--slot);text-align:center;line-height:1.1;padding:1px;
  }
  .thumb img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;display:block;
  }

  .row .y,
  #ov .y{
    padding-left:0.3em;
    font-family:Helvetica,'Helvetica Neue',Arial,sans-serif;
    font-size:0.34em;
    letter-spacing:0.02em;
    white-space:nowrap;
    position:relative;
    top:-0.02em;
  }

  /* ── cursor dot + punched-out inversion ───────────── */
  #dot{
    position:fixed;top:0;left:0;
    width:var(--dot);height:var(--dot);
    border-radius:50%;
    background:var(--ink);
    pointer-events:none;
    z-index:60;
    opacity:0;
    transition:opacity .18s ease;
  }
  #ov{
    position:fixed;top:0;left:0;
    pointer-events:none;
    z-index:61;
    opacity:0;
    color:#fff;
    display:flex;align-items:center;gap:0.22em;
    font-size:var(--row);
    line-height:1.22;
    letter-spacing:-0.01em;
    white-space:nowrap;
  }
  #ov .thumb{background:#000;transform:scale(1.1)}
  #ov .thumb .hatch{
    background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.5) 0 1px,transparent 1px 6px);
  }
  #ov .thumb .slot{color:rgba(255,255,255,.75)}

  /* ── colophon ─────────────────────────────────────── */
  .colophon{
    margin-top:clamp(46px,7vw,86px);
    font-size:clamp(15px,1.5vw,18px);
    line-height:1.7;
    color:#6b6b66;
  }
  .colophon a{border-bottom:1px solid #cfcfc8;cursor:inherit}
  .colophon a:hover{color:var(--ink);border-bottom-color:var(--ink)}
  .colophon .sep{padding:0 .5em;color:#c3c3bc}

  .socials{display:flex;gap:8px;margin-top:18px}
  .socials a{
    width:30px;height:30px;border-radius:50%;
    background:var(--ink);color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-family:Helvetica,'Helvetica Neue',Arial,sans-serif;
    font-size:10px;letter-spacing:0.02em;
    cursor:inherit;border-bottom:0;
    transition:background .2s ease;
  }
  .socials a:hover{background:#3d3d38;color:var(--paper)}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>

const DOT = 18;          // resting cursor size, px
const GROW = 1.8;        // multiplier when the cursor is over type

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ── build the index ─────────────────────────────────────── */
const index = document.getElementById("index");

function rowInner(p){
  const fill = p.img
    ? `<img src="${esc(p.img)}" alt="${esc(p.title)}" loading="lazy">`
    : `<span class="hatch"></span><span class="slot">${esc(p.slot)}</span>`;
  const h = p.h || 0.86;
  const tags = (p.tags || []).length
    ? `<span class="tags">` + p.tags.map(t => `<i class="t-${t}"></i>`).join("") + `</span>`
    : "";
  return tags
       + `<span class="t">${esc(p.title)}</span>`
       + `<span class="thumb" style="width:${(p.w * h).toFixed(2)}em;height:${h}em">${fill}</span>`
       + `<span class="y">${esc(p.year)}</span>`
       + (p.tf ? `<a class="tf" href="${esc(p.tf)}" target="_blank" rel="noopener">TestFlight</a>` : "");
}

PROJECTS.forEach(p => {
  const el = document.createElement(p.url && !p.tf ? "a" : "div");
  el.className = "row";
  if (p.url && !p.tf) { el.href = p.url; el.target = "_blank"; el.rel = "noopener"; }
  el.innerHTML = rowInner(p);
  el.__project = p;
  index.appendChild(el);
});

/* ── cursor dot and the white copy punched out inside it ── */
const dot = document.getElementById("dot");
const ov  = document.getElementById("ov");
const tip = document.getElementById("tip");
const gal = document.getElementById("shots");

/* panels trail the cursor rather than snapping to it */
function follower(el){
  const s = { x:0, y:0, tx:0, ty:0, raf:null };
  function place(){
    const r = el.getBoundingClientRect();
    const pad = 16, off = 26;
    s.tx = Math.min(mouse.x + off, window.innerWidth  - r.width  - pad);
    s.ty = Math.min(mouse.y + off, window.innerHeight - r.height - pad);
    if (s.tx < pad) s.tx = pad;
    if (s.ty < pad) s.ty = pad;
  }
  function loop(){
    s.x += (s.tx - s.x) * 0.18;
    s.y += (s.ty - s.y) * 0.18;
    el.style.transform = `translate3d(${s.x.toFixed(1)}px,${s.y.toFixed(1)}px,0)`;
    if (Math.abs(s.tx - s.x) > 0.4 || Math.abs(s.ty - s.y) > 0.4) {
      s.raf = requestAnimationFrame(loop);
    } else { s.raf = null; }
  }
  return function move(jump){
    place();
    if (jump) { s.x = s.tx; s.y = s.ty;
      el.style.transform = `translate3d(${s.x}px,${s.y}px,0)`; return; }
    if (!s.raf) s.raf = requestAnimationFrame(loop);
  };
}
const moveTip = follower(tip);
const moveGal = follower(gal);

function showTip(p){
  if (!desktop || !p) { hideTip(); return; }
  const pic = p.img
    ? `<img class="pic" src="${esc(p.img)}" alt="">`
    : `<span class="pic"></span>`;
  tip.innerHTML = pic
    + (p.sub ? `<div class="sub">${esc(p.sub)}</div>` : "")
    + `<p>${esc(p.note || "—")}</p>`
    + (p.meta ? `<div class="meta">${esc(p.meta)}</div>` : "");
  moveTip(true);
  tip.classList.add("on");
}
function hideTip(){ tip.classList.remove("on"); }

function showGal(p){
  if (!desktop || !p || !p.shots || !p.shots.length) { hideGal(); return; }
  gal.innerHTML = `<div class="strip">`
    + p.shots.map(src => `<img src="${esc(src)}" alt="">`).join("")
    + `</div><div class="cap">${esc(p.title)} — ${p.shots.length} screens</div>`;
  moveGal(true);
  gal.classList.add("on");
}
function hideGal(){ gal.classList.remove("on"); }

let mouse = { x: -9999, y: -9999 };
let hoverEl = null;
let overText = false;
let desktop = false;

const mq = window.matchMedia("(min-width: 760px) and (hover: hover)");
function syncMode(){
  desktop = mq.matches;
  document.body.classList.toggle("cursor-none", desktop);
  if (!desktop) { dot.style.opacity = "0"; ov.style.opacity = "0"; }
}
mq.addEventListener ? mq.addEventListener("change", syncMode) : mq.addListener(syncMode);
syncMode();

function paint(){
  const size = DOT * (overText ? GROW : 1);
  const h = size / 2;
  const on = desktop && mouse.x > -1000;

  dot.style.opacity = on ? "1" : "0";
  dot.style.width = dot.style.height = size + "px";
  if (on) dot.style.transform = `translate3d(${mouse.x - h}px,${mouse.y - h}px,0)`;

  if (on && hoverEl) {
    const r = hoverEl.getBoundingClientRect();
    ov.style.opacity = "1";
    ov.style.transform = `translate3d(${r.left}px,${r.top}px,0)`;
    ov.style.height = r.height + "px";
    ov.style.clipPath = `circle(${h}px at ${mouse.x - r.left}px ${mouse.y - r.top}px)`;
  } else {
    ov.style.opacity = "0";
  }
}

function enterRow(el){
  hoverEl = el;
  overText = true;
  const p = el.__project;
  ov.classList.toggle("is-mast", !p);
  ov.innerHTML = p ? rowInner(p) : `<span class="t">${esc(el.textContent.trim())}</span>`;
  paint();
}
function leaveRow(){
  hoverEl = null;
  overText = false;
  paint();
}

[...document.querySelectorAll(".row")].forEach(el => {
  const p = el.__project;
  const title = el.querySelector(".t");
  const thumb = el.querySelector(".thumb");

  // the inverted cursor still tracks the whole row
  el.addEventListener("mouseenter", () => enterRow(el));
  el.addEventListener("mouseleave", () => { leaveRow(); hideTip(); hideGal(); });

  // the note opens on the title only
  if (title) {
    title.addEventListener("mouseenter", () => { hideGal(); showTip(p); });
    title.addEventListener("mouseleave", hideTip);
  }

  // every screenshot opens on the thumbnail
  if (thumb) {
    thumb.addEventListener("mouseenter", () => { hideTip(); showGal(p); });
    thumb.addEventListener("mouseleave", hideGal);
  }
});

const mast = document.getElementById("mast");
mast.addEventListener("mouseenter", () => enterRow(mast));
mast.addEventListener("mouseleave", leaveRow);

document.addEventListener("mousemove", e => {
  mouse = { x: e.clientX, y: e.clientY };
  paint();
  if (tip.classList.contains("on")) moveTip(false);
  if (gal.classList.contains("on")) moveGal(false);
});
document.addEventListener("mouseleave", () => {
  mouse = { x: -9999, y: -9999 };
  overText = false;
  hideTip(); hideGal();
  paint();
});
window.addEventListener("scroll", paint, { passive:true });
window.addEventListener("resize", paint);
</script>
